<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIT Declaration Form Generator</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --secondary: #10B981;
            --secondary-hover: #059669;
            --bg-gradient: linear-gradient(135deg, #0F172A 0%, #1E1B4B 50%, #0F172A 100%);
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-dark: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
            --focus-ring: rgba(79, 70, 229, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-dark);
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wrapper {
            max-width: 720px;
            width: 100%;
        }

        .card {
            position: relative;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .badge {
            display: inline-block;
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
            font-weight: 700;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 50px;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
        }

        .btn-customise-trigger {
            position: absolute;
            top: 24px;
            right: 24px;
            background: #F1F5F9;
            color: #475569;
            border: 1px solid #E2E8F0;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-customise-trigger:hover {
            background: #E2E8F0;
            color: #0F172A;
            transform: rotate(30deg);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(4px);
            z-index: 1000;
            align-items: flex-start;
            justify-content: center;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-card {
            background: #FFFFFF;
            border-radius: 16px;
            max-width: 500px;
            width: 100%;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            margin: 40px auto;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #E2E8F0;
            padding-bottom: 12px;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 700;
            color: #0F172A;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 20px;
            color: #94A3B8;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-group input[type="text"],
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
            color: var(--text-dark);
            background: #F8FAFC;
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-group input[type="text"]:focus,
        .form-group select:focus {
            background: #FFFFFF;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        .form-group input[readonly] {
            background: #F1F5F9;
            color: #64748B;
            cursor: not-allowed;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .section-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
            margin: 24px 0 14px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .checkbox-group {
            background: #F8FAFC;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .checkbox-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
            font-size: 13.5px;
            color: #334155;
            line-height: 1.4;
        }

        .checkbox-item:last-child {
            margin-bottom: 0;
        }

        .checkbox-item input[type="checkbox"] {
            margin-top: 2px;
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .sync-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
            margin-left: 6px;
        }

        .sync-badge.loading {
            background: #FEF3C7;
            color: #D97706;
        }

        .sync-badge.success {
            background: #D1FAE5;
            color: #059669;
        }

        .sig-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid var(--border-color);
            background: #F8FAFC;
            color: #64748B;
            border-radius: 8px;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--primary);
            color: #FFFFFF;
            border-color: var(--primary);
        }

        .sig-panel {
            display: none;
        }

        .sig-panel.active {
            display: block;
        }

        .canvas-container {
            border: 1.5px solid var(--border-color);
            border-radius: 10px;
            background: #FFFFFF;
            position: relative;
            margin-bottom: 8px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 140px;
            border-radius: 10px;
            cursor: crosshair;
        }

        .canvas-actions {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 14px;
        }

        .btn-clear {
            background: none;
            border: none;
            color: #EF4444;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 28px;
        }

        .btn {
            padding: 14px;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #FFFFFF;
        }

        .btn-primary {
            background: var(--primary);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--secondary);
        }

        .btn-secondary:hover {
            background: var(--secondary-hover);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .btn-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2.5px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            border-top-color: #FFFFFF;
            animation: spin 0.7s linear infinite;
        }

        .btn.btn-loading {
            opacity: 0.88;
            pointer-events: none;
            transform: scale(0.97);
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.4);
        }

        .btn.btn-success-anim {
            background: #059669 !important;
            transform: scale(1.02);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @media (max-width: 600px) {
            .card {
                padding: 24px 18px;
            }

            .form-row {
                grid-template-columns: 1fr !important;
                gap: 12px;
            }

            .btn-group {
                grid-template-columns: 1fr;
            }

            .modal-overlay {
                padding: 0 !important;
            }

            .modal-card {
                width: 100% !important;
                height: 100% !important;
                max-width: 100% !important;
                min-height: 100vh !important;
                border-radius: 0 !important;
                margin: 0 !important;
                padding: 24px 20px;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>
    <div class="wrapper">
        <div class="card">
            <button type="button" class="btn-customise-trigger" onclick="openCustomiseModal()" title="Customise Profile & Add Subjects" aria-label="Customise Profile & Add Subjects">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </button>
            <div class="header">
                <div class="badge">Vidyalankar Institute of Technology</div>
                <h1>Ethical Practice Undertaking</h1>
                <p class="subtitle">Generate & download official declaration forms formatted for VIT submissions</p>
            </div>

            <form id="mainForm" action="/generate" method="POST" enctype="multipart/form-data" onsubmit="prepareFormSubmission()">
                <input type="hidden" name="format" id="format" value="docx">

                <!-- Section 1: Subject Details -->
                <div class="section-title">Subject & Academic Vertical</div>

                <div class="form-group">
                    <label for="subject_idx">Subject Name</label>
                    <select id="subject_idx" name="subject_idx" onchange="updateSubjectDetails()">
                        <!-- Dynamically populated or default -->
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Subject Code</label>
                        <input type="text" id="subject_code" name="subject_code" readonly>
                    </div>
                    <div class="form-group">
                        <label>Vertical</label>
                        <input type="text" id="vertical" name="vertical" readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label for="assignment_no">Assignment / Experiment No.</label>
                    <input type="text" id="assignment_no" name="assignment_no" value="Experiment 1" required>
                </div>

                <!-- Section 2: Student Information -->
                <div class="section-title">
                    Student Information 
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="roll_no">
                            Roll No. 
                            <span id="sync-badge" class="sync-badge" style="display:none;"></span>
                        </label>
                        <input type="text" id="roll_no" name="roll_no" placeholder="e.g. 24102A0001" required 
                            onblur="fetchStudentProfile()" 
                            onkeydown="if(event.key === 'Enter'){ event.preventDefault(); fetchStudentProfile(); }" 
                            oninput="handleRollNoInput()">
                    </div>
                    <div class="form-group">
                        <label for="student_name">Full Name</label>
                        <input type="text" id="student_name" name="student_name" placeholder="e.g. John Doe" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="branch">Branch</label>
                        <input type="text" id="branch" name="branch" placeholder="e.g. CMPN" required>
                    </div>
                    <div class="form-group">
                        <label for="semester">Semester</label>
                        <input type="text" id="semester" name="semester" placeholder="e.g. V" required>
                    </div>
                    <div class="form-group">
                        <label for="division">Division</label>
                        <input type="text" id="division" name="division" placeholder="e.g. A" required>
                    </div>
                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="text" id="date" name="date" value="" required>
                    </div>
                </div>

                <!-- Section 3: Declaration Checkboxes -->
                <div class="section-title">Declaration Terms</div>

                <div class="checkbox-group">
                    <div class="checkbox-item">
                        <input type="checkbox" name="selected_options" value="1" id="opt1" checked>
                        <label for="opt1">(1) I have completed the assignment / academic activity independently.</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="selected_options" value="2" id="opt2" checked>
                        <label for="opt2">(2) I have used AI tools solely for assistance (e.g. proofreading, debugging, understanding concepts) and not for generating the core submission content.</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="selected_options" value="3" id="opt3" checked>
                        <label for="opt3">(3) I have properly cited and acknowledged all sources, tools, and assistance used in completing this work.</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="selected_options" value="4" id="opt4">
                        <label for="opt4">(4) The submitted work was generated directly using AI tools without substantial independent effort.</label>
                    </div>
                    <div class="checkbox-item">
                        <input type="checkbox" name="selected_options" value="5" id="opt5">
                        <label for="opt5">(5) The submitted work is copied or plagiarized from another source.</label>
                    </div>
                </div>

                <!-- Section 4: Signature Input -->
                <div class="section-title">Signature</div>

                <div class="sig-tabs">
                    <button type="button" class="tab-btn active" onclick="switchSigTab('draw', event)">Draw Signature</button>
                    <button type="button" class="tab-btn" onclick="switchSigTab('upload', event)">Upload Image</button>
                </div>

                <div id="panel-draw" class="sig-panel active">
                    <div class="canvas-container">
                        <canvas id="sig-canvas"></canvas>
                    </div>
                    <div class="canvas-actions">
                        <button type="button" class="btn-clear" onclick="clearCanvas()">Clear Signature</button>
                    </div>
                    <input type="hidden" name="signature_draw_data" id="signature_draw_data">
                </div>

                <div id="panel-upload" class="sig-panel">
                    <div class="form-group">
                        <input type="file" id="signature" name="signature" accept="image/*">
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="btn-group">
                    <button type="submit" id="btn-docx" onclick="document.getElementById('format').value='docx'; triggerButtonTransition(this, '.DOCX');" class="btn btn-primary">
                        📝 Generate .DOCX
                    </button>
                    <button type="submit" id="btn-pdf" onclick="document.getElementById('format').value='pdf'; triggerButtonTransition(this, '.PDF');" class="btn btn-secondary">
                        📄 Generate .PDF
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Customise Modal -->
    <div id="customise-modal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Customise Profile & Subjects</h3>
                <button type="button" class="modal-close" onclick="closeCustomiseModal()">&times;</button>
            </div>
            
            <div class="form-group">
                <label style="font-weight: 700; color: #4F46E5;">🌐 Backend API URL (Optional for Netlify)</label>
                <input type="text" id="api_base_input" placeholder="https://your-backend-api.onrender.com">
                <button type="button" onclick="saveBackendApiUrl()" class="btn btn-primary" style="margin-top: 6px; padding: 6px 12px; font-size: 12px;">Save API URL</button>
            </div>
            <hr style="margin: 14px 0; border: none; border-top: 1px solid #E2E8F0;">

            <div class="form-group">
                <label style="font-weight: 700;">➕ Add Custom Subject</label>
                <input type="text" id="cust_sub_name" placeholder="Subject Name (e.g. Robotics)" style="margin-bottom: 8px;">
                <input type="text" id="cust_sub_code" placeholder="Subject Code (e.g. ROB101)" style="margin-bottom: 8px;">
                <input type="text" id="cust_sub_vert" placeholder="Vertical (e.g. HSSM_VEC / CUSTOM)" style="margin-bottom: 8px;">
                <button type="button" onclick="addCustomSubject()" class="btn btn-primary" style="width: 100%; padding: 10px; font-size: 13px;">Add Subject</button>
            </div>

            <hr style="margin: 18px 0; border: none; border-top: 1px solid #E2E8F0;">

            <div class="form-group">
                <label style="font-weight: 700;">👤 Customise Profile Defaults</label>
                <input type="text" id="cust_roll_no" placeholder="e.g. 24102A0001" style="margin-bottom: 8px;">
                <input type="text" id="cust_student_name" placeholder="e.g. John Doe" style="margin-bottom: 8px;">
                <div class="form-row" style="margin-bottom: 8px;">
                    <div class="form-group" style="margin-bottom:0;">
                        <label style="font-size: 12px;">Branch</label>
                        <input type="text" id="cust_branch" placeholder="e.g. CMPN">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label style="font-size: 12px;">Semester</label>
                        <input type="text" id="cust_semester" placeholder="e.g. V">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label style="font-size: 12px;">Division</label>
                        <input type="text" id="cust_division" placeholder="e.g. A">
                    </div>
                </div>
                <button type="button" onclick="saveCustomProfileDefaults()" class="btn btn-secondary" style="width: 100%; padding: 10px; font-size: 13px;">
                    Save Profile Defaults
                </button>
            </div>
        </div>
    </div>

    <script>
        const DEFAULT_SUBJECTS = [
            {"name": "E-Waste and Environmental Management", "code": "VEC02", "vertical": "HSSM_VEC"},
            {"name": "Artificial Intelligence", "code": "PCCE10T", "vertical": "CMPN_CORE"},
            {"name": "Machine Learning", "code": "PCCE11T", "vertical": "CMPN_CORE"},
            {"name": "Cloud Computing", "code": "PCCE12T", "vertical": "CMPN_CORE"},
            {"name": "Software Engineering", "code": "PCCE13T", "vertical": "CMPN_CORE"}
        ];

        function getApiBaseUrl() {
            return (localStorage.getItem('API_BASE_URL') || '').replace(/\/+$/, '');
        }

        function saveBackendApiUrl() {
            const url = document.getElementById('api_base_input').value.trim();
            localStorage.setItem('API_BASE_URL', url);
            alert("Backend API URL saved!");
        }

        // --- MODAL LOGIC ---
        function openCustomiseModal() {
            document.getElementById('api_base_input').value = localStorage.getItem('API_BASE_URL') || '';
            document.getElementById('cust_roll_no').value = document.getElementById('roll_no').value;
            document.getElementById('cust_student_name').value = document.getElementById('student_name').value;
            document.getElementById('cust_branch').value = document.getElementById('branch').value;
            document.getElementById('cust_semester').value = document.getElementById('semester').value;
            document.getElementById('cust_division').value = document.getElementById('division').value;
            document.getElementById('customise-modal').classList.add('open');
        }

        function closeCustomiseModal() {
            document.getElementById('customise-modal').classList.remove('open');
        }

        function addCustomSubject() {
            const name = document.getElementById('cust_sub_name').value.trim();
            const code = document.getElementById('cust_sub_code').value.trim();
            const vert = document.getElementById('cust_sub_vert').value.trim() || 'CUSTOM';

            if (!name || !code) {
                alert("Please enter both Subject Name and Subject Code.");
                return;
            }

            const select = document.getElementById("subject_idx");
            const option = document.createElement("option");
            option.value = select.options.length;
            option.text = name;
            option.setAttribute("data-code", code);
            option.setAttribute("data-vertical", vert);
            select.appendChild(option);
            select.selectedIndex = select.options.length - 1;
            updateSubjectDetails();

            let customSubjects = JSON.parse(localStorage.getItem('custom_subjects') || '[]');
            customSubjects.push({ name, code, vertical: vert });
            localStorage.setItem('custom_subjects', JSON.stringify(customSubjects));

            document.getElementById('cust_sub_name').value = '';
            document.getElementById('cust_sub_code').value = '';
            document.getElementById('cust_sub_vert').value = '';
            closeCustomiseModal();

            alert(`Subject "${name}" (${code}) added successfully.`);
        }

        function loadCustomSubjects() {
            const select = document.getElementById("subject_idx");
            select.innerHTML = '';
            
            DEFAULT_SUBJECTS.forEach((item, idx) => {
                const opt = document.createElement("option");
                opt.value = idx;
                opt.text = item.name;
                opt.setAttribute("data-code", item.code);
                opt.setAttribute("data-vertical", item.vertical);
                select.appendChild(opt);
            });

            let customSubjects = JSON.parse(localStorage.getItem('custom_subjects') || '[]');
            customSubjects.forEach((item) => {
                const opt = document.createElement("option");
                opt.value = select.options.length;
                opt.text = item.name;
                opt.setAttribute("data-code", item.code);
                opt.setAttribute("data-vertical", item.vertical);
                select.appendChild(opt);
            });
        }

        function saveCustomProfileDefaults() {
            const rollNo = document.getElementById('cust_roll_no').value.trim();
            if (rollNo) document.getElementById('roll_no').value = rollNo;
            document.getElementById('student_name').value = document.getElementById('cust_student_name').value.trim();
            document.getElementById('branch').value = document.getElementById('cust_branch').value.trim();
            document.getElementById('semester').value = document.getElementById('cust_semester').value.trim();
            document.getElementById('division').value = document.getElementById('cust_division').value.trim();

            saveStudentProfile();
            closeCustomiseModal();
            alert("Student profile defaults saved successfully.");
        }

        async function fetchStudentProfile() {
            const rollNo = document.getElementById('roll_no').value.trim();
            const badge = document.getElementById('sync-badge');

            if (!rollNo) {
                badge.style.display = 'none';
                return;
            }

            badge.style.display = 'inline-block';
            badge.textContent = 'Checking...';
            badge.className = 'sync-badge loading';

            let loaded = false;

            const localData = localStorage.getItem('student_profile_' + rollNo);
            if (localData) {
                try {
                    const profile = JSON.parse(localData);
                    applyProfileToForm(profile);
                    badge.style.display = 'inline-block';
                    badge.textContent = 'Loaded (Local)';
                    badge.className = 'sync-badge success';
                    loaded = true;
                } catch (e) {}
            }

            if (!loaded) {
                badge.style.display = 'inline-block';
                badge.textContent = 'No Local Profile';
                badge.className = 'sync-badge info';
                setTimeout(() => {
                    if (badge.textContent === 'No Local Profile') {
                        badge.style.display = 'none';
                    }
                }, 3000);
            }
        }

        function applyProfileToForm(profile) {
            if (profile.student_name) document.getElementById('student_name').value = profile.student_name;
            if (profile.branch) document.getElementById('branch').value = profile.branch;
            if (profile.semester) document.getElementById('semester').value = profile.semester;
            if (profile.division) document.getElementById('division').value = profile.division;

            if (profile.custom_subjects) {
                let list = Array.isArray(profile.custom_subjects) ? profile.custom_subjects : [];
                if (typeof profile.custom_subjects === 'string') {
                    try { list = JSON.parse(profile.custom_subjects); } catch (e) {}
                }
                if (list.length > 0) {
                    let localCustoms = JSON.parse(localStorage.getItem('custom_subjects') || '[]');
                    list.forEach(cs => {
                        if (!localCustoms.some(lc => lc.code === cs.code)) {
                            localCustoms.push(cs);
                        }
                    });
                    localStorage.setItem('custom_subjects', JSON.stringify(localCustoms));
                    loadCustomSubjects();
                }
            }

            if (profile.last_subject_code) {
                const select = document.getElementById("subject_idx");
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].getAttribute("data-code") === profile.last_subject_code) {
                        select.selectedIndex = i;
                        updateSubjectDetails();
                        break;
                    }
                }
            }

            if (profile.signature_data && profile.signature_data.startsWith('data:image')) {
                const img = new Image();
                img.onload = function () {
                    clearCanvas();
                    ctx.drawImage(img, 0, 0);
                    hasDrawn = true;
                    document.getElementById('signature_draw_data').value = profile.signature_data;
                };
                img.src = profile.signature_data;
            }
        }

        async function saveStudentProfile() {
            const rollNo = document.getElementById('roll_no').value.trim();
            if (!rollNo) return;

            const select = document.getElementById("subject_idx");
            const selectedOpt = select.options[select.selectedIndex];

            let sigData = '';
            if (hasDrawn) {
                sigData = canvas.toDataURL('image/png');
            } else {
                sigData = document.getElementById('signature_draw_data').value || '';
            }

            const profileData = {
                roll_no: rollNo,
                student_name: document.getElementById('student_name').value.trim(),
                branch: document.getElementById('branch').value.trim(),
                semester: document.getElementById('semester').value.trim(),
                division: document.getElementById('division').value.trim(),
                last_subject_code: selectedOpt ? selectedOpt.getAttribute("data-code") : '',
                last_subject_name: selectedOpt ? selectedOpt.text.trim() : '',
                custom_subjects: JSON.parse(localStorage.getItem('custom_subjects') || '[]'),
                signature_data: sigData,
                updated_at: new Date().toISOString()
            };

            localStorage.setItem('student_profile_' + rollNo, JSON.stringify(profileData));
            localStorage.setItem('last_active_roll_no', rollNo);
        }

        let rollNoTimer = null;
        function handleRollNoInput() {
            clearTimeout(rollNoTimer);
            rollNoTimer = setTimeout(fetchStudentProfile, 600);
        }

        function updateSubjectDetails() {
            const select = document.getElementById("subject_idx");
            if (select.options.length === 0) return;
            const selectedOpt = select.options[select.selectedIndex];
            document.getElementById("subject_code").value = selectedOpt.getAttribute("data-code");
            document.getElementById("vertical").value = selectedOpt.getAttribute("data-vertical");
        }

        let activeTab = 'draw';
        function switchSigTab(tab, event) {
            activeTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.sig-panel').forEach(p => p.classList.remove('active'));

            event.target.classList.add('active');
            if (tab === 'draw') {
                document.getElementById('panel-draw').classList.add('active');
            } else {
                document.getElementById('panel-upload').classList.add('active');
            }
        }

        const canvas = document.getElementById('sig-canvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;
        let hasDrawn = false;

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = 140;
            ctx.lineWidth = 2.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.strokeStyle = '#0F172A';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        let allStrokes = [];
        let currentStroke = [];

        function startDrawing(e) {
            isDrawing = true;
            hasDrawn = true;
            currentStroke = [getPos(e)];
            redrawAllStrokes();
        }

        function draw(e) {
            if (!isDrawing) return;
            currentStroke.push(getPos(e));
            redrawAllStrokes();
        }

        function stopDrawing() {
            if (isDrawing && currentStroke.length > 0) {
                allStrokes.push(currentStroke);
                currentStroke = [];
                redrawAllStrokes();
            }
            isDrawing = false;
        }

        function drawStroke(pts) {
            if (!pts || pts.length === 0) return;
            if (pts.length === 1) {
                ctx.beginPath();
                ctx.arc(pts[0].x, pts[0].y, ctx.lineWidth / 2, 0, Math.PI * 2);
                ctx.fill();
                return;
            }
            if (pts.length === 2) {
                ctx.beginPath();
                ctx.moveTo(pts[0].x, pts[0].y);
                ctx.lineTo(pts[1].x, pts[1].y);
                ctx.stroke();
                return;
            }

            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i < pts.length - 2; i++) {
                const xc = (pts[i].x + pts[i + 1].x) / 2;
                const yc = (pts[i].y + pts[i + 1].y) / 2;
                ctx.quadraticCurveTo(pts[i].x, pts[i].y, xc, yc);
            }
            const lastSec = pts[pts.length - 2];
            const lastPt = pts[pts.length - 1];
            ctx.quadraticCurveTo(lastSec.x, lastSec.y, lastPt.x, lastPt.y);
            ctx.stroke();
        }

        function redrawAllStrokes() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0F172A';
            for (let i = 0; i < allStrokes.length; i++) {
                drawStroke(allStrokes[i]);
            }
            if (currentStroke.length > 0) {
                drawStroke(currentStroke);
            }
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            allStrokes = [];
            currentStroke = [];
            hasDrawn = false;
        }

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing);
        canvas.addEventListener('touchmove', draw);
        canvas.addEventListener('touchend', stopDrawing);

        function triggerButtonTransition(btn, formatName) {
            const originalHTML = btn.innerHTML;
            btn.classList.add('btn-loading');
            btn.innerHTML = `<span class="btn-spinner"></span> Generating ${formatName}...`;

            setTimeout(() => {
                btn.classList.remove('btn-loading');
                btn.classList.add('btn-success-anim');
                btn.innerHTML = `✅ ${formatName} Downloaded!`;

                setTimeout(() => {
                    btn.classList.remove('btn-success-anim');
                    btn.innerHTML = originalHTML;
                }, 2500);
            }, 1200);
        }

        function prepareFormSubmission() {
            saveStudentProfile();
            if (activeTab === 'draw' && hasDrawn) {
                document.getElementById('signature_draw_data').value = canvas.toDataURL('image/png');
            } else if (activeTab !== 'draw') {
                document.getElementById('signature_draw_data').value = '';
            }
            const mainForm = document.getElementById('mainForm');
            mainForm.action = getApiBaseUrl() + '/generate';
        }

        // Default today date
        const d = new Date();
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const yyyy = d.getFullYear();
        document.getElementById('date').value = `${dd}-${mm}-${yyyy}`;

        const savedLastRoll = localStorage.getItem('last_active_roll_no');
        if (savedLastRoll) {
            document.getElementById('roll_no').value = savedLastRoll;
            loadCustomSubjects();
            updateSubjectDetails();
            fetchStudentProfile();
        } else {
            document.getElementById('roll_no').value = '';
            document.getElementById('student_name').value = '';
            document.getElementById('branch').value = '';
            document.getElementById('semester').value = '';
            document.getElementById('division').value = '';
            loadCustomSubjects();
            updateSubjectDetails();
        }
    </script>
</body>

</html>
